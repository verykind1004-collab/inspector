<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Tablespace 모니터링 대시보드</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#0e1117;--bg1:#161b27;--bg2:#1c2233;--bg3:#222840;
  --bd:#2a3050;--t1:#c8cdd8;--t2:#8890a8;--t3:#555f78;
  --blue:#6c54e8;--teal:#00c9b0;--green:#2ed573;
  --red:#ff4757;--orange:#ffa502;--yellow:#ffd32a;--lime:#7bed9f;
  --sel:rgba(108,84,232,0.12);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg0);color:var(--t1);font-family:'Malgun Gothic','Segoe UI',sans-serif;font-size:12px;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
.hdr{background:var(--bg1);border-bottom:1px solid var(--bd);padding:7px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.hdr-logo{color:var(--blue);font-family:'Inter',sans-serif;font-weight:800;font-size:15px;letter-spacing:.02em;}
.hdr-sep{color:var(--bd);}
.hdr-title{color:var(--t2);font-size:11px;}
.layout{display:flex;flex:1;overflow:hidden;gap:1px;background:var(--bd);}
.left{display:flex;flex-direction:column;flex:6;overflow:hidden;background:var(--bg0);}
.right{flex:4;min-width:0;background:var(--bg1);display:flex;flex-direction:column;overflow:hidden;}
.sec{display:flex;flex-direction:column;overflow:hidden;}
.sec-db{flex:0 0 42%;border-bottom:1px solid var(--bd);}
.sec-ts{flex:1;}
.sec-hdr{background:var(--bg2);padding:7px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--bd);flex-shrink:0;}
.sec-title{font-weight:bold;color:var(--t1);}
.sec-date{color:var(--t3);font-size:11px;}
.spacer{flex:1;}
.search{background:var(--bg3);border:1px solid var(--bd);color:var(--t1);padding:3px 8px;border-radius:3px;font-size:11px;width:110px;outline:none;}
.search:focus{border-color:var(--blue);}
.btn{padding:3px 10px;border-radius:3px;font-size:11px;cursor:pointer;border:1px solid;}
.btn-export{background:rgba(108,84,232,0.1);border-color:var(--blue);color:var(--blue);}
.btn-export:hover{background:rgba(108,84,232,0.22);}
.btn-refresh{background:var(--bg3);border-color:var(--bd);color:var(--t2);}
.tbl-wrap{overflow:auto;flex:1;}
table{border-collapse:collapse;font-size:11px;table-layout:fixed;}
thead{position:sticky;top:0;z-index:2;}
th{background:var(--bg3);color:var(--t2);padding:5px 8px 5px 4px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap;overflow:hidden;position:relative;user-select:none;}
th.drag-over{background:rgba(74,158,255,0.18) !important;border-left:2px solid var(--blue);}
th.dragging{opacity:0.4;}
td{padding:5px 8px;border-bottom:1px solid #1a1f30;white-space:nowrap;vertical-align:middle;overflow:hidden;}
tr:hover td{background:rgba(255,255,255,0.03);}
tr.selected td{background:rgba(108,84,232,0.22);}
tr.selected td:first-child{box-shadow:inset 3px 0 0 var(--blue);}
tr.selected.row-warn td:first-child{box-shadow:inset 3px 0 0 var(--orange);}
tr.selected.row-crit td:first-child{box-shadow:inset 3px 0 0 var(--red);}
tr{cursor:pointer;}
.col-grip{display:inline-block;cursor:grab;color:var(--t3);margin-right:3px;font-size:12px;vertical-align:middle;opacity:0.6;}
.col-grip:hover{color:var(--blue);opacity:1;}
.col-label{cursor:pointer;vertical-align:middle;}
.col-label:hover{color:var(--t1);}
.sort-asc .col-label::after{content:' \25B2';font-size:9px;color:var(--blue);}
.sort-desc .col-label::after{content:' \25BC';font-size:9px;color:var(--blue);}
.col-resize{position:absolute;right:0;top:0;bottom:0;width:5px;cursor:col-resize;z-index:3;}
.col-resize:hover,.col-resize.active{background:var(--blue);opacity:0.6;}
.col-info{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border-radius:50%;background:rgba(108,84,232,0.18);color:var(--blue);font-size:9px;font-weight:bold;cursor:default;margin-left:3px;vertical-align:middle;flex-shrink:0;}
#col-tooltip{position:fixed;background:var(--bg2);border:1px solid var(--bd);border-radius:5px;padding:7px 10px;font-size:11px;color:var(--t1);width:230px;white-space:normal;line-height:1.65;z-index:9999;pointer-events:none;box-shadow:0 3px 12px rgba(0,0,0,0.3);display:none;}
.c-red{color:var(--red);font-weight:bold;}
.c-orange{color:var(--orange);}
.c-yellow{color:var(--yellow);}
.c-lime{color:var(--lime);}
.c-green{color:var(--green);}
.prog{display:flex;align-items:center;gap:4px;}
.prog-bg{width:46px;flex-shrink:0;height:5px;background:#1e2440;border-radius:2px;overflow:hidden;}
.prog-fill{height:100%;border-radius:2px;}
.prog-pct{min-width:34px;text-align:right;}
.t-up{color:var(--red);font-size:10px;}
.t-dn{color:var(--green);font-size:10px;}
.t-fl{color:var(--t3);font-size:10px;}
.db-lnk{color:var(--blue);}
.ts-lnk{color:var(--teal);}
.chart-sec{display:flex;flex-direction:column;padding:10px 12px;border-bottom:1px solid var(--bd);}
.chart-sec:last-child{border-bottom:none;flex:1;}
.chart-title{font-size:11px;color:var(--t2);margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.chart-title strong{color:var(--t1);}
.chip{background:var(--bg3);padding:1px 6px;border-radius:2px;font-size:10px;color:var(--teal);}
.chart-wrap{position:relative;}
.chart-hint{color:var(--t3);font-size:11px;text-align:center;padding:30px 0;position:absolute;width:100%;top:0;}
.no-data td{text-align:center;color:var(--t3);padding:18px;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg0);}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px;}
.tbl-wrap::-webkit-scrollbar{width:8px;height:8px;}
.tbl-wrap::-webkit-scrollbar-track{background:var(--bg1);}
.tbl-wrap::-webkit-scrollbar-thumb{background:var(--t3);border-radius:4px;}
.tbl-wrap::-webkit-scrollbar-thumb:hover{background:var(--t2);}
body.col-resizing{cursor:col-resize !important;}
body.col-resizing *{cursor:col-resize !important;user-select:none !important;}

/* ===== LIGHT MODE ===== */
body.light{
  --bg0:#f0f3f8;--bg1:#ffffff;--bg2:#f5f7fb;--bg3:#e8ecf4;
  --bd:#cdd4e4;--t1:#1a2038;--t2:#4a5470;--t3:#8896b0;
  --blue:#6c54e8;--teal:#0891b2;--green:#16a34a;
  --red:#dc2626;--orange:#ea580c;--yellow:#b45309;--lime:#4d7c0f;
  --sel:rgba(108,84,232,0.09);
}
body.light .prog-bg{background:#d5dce8;}
body.light td{border-bottom-color:#e8ecf5;}
body.light tr:hover td{background:rgba(0,0,0,0.025);}
body.light .chart-sec{border-bottom-color:var(--bd);}
body.light .sec-hdr{background:var(--bg2);}

/* 서버 상태 배지 */
.srv-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:3px;font-size:10px;border:1px solid;cursor:default;}
.srv-badge.ok{background:rgba(22,163,74,0.1);border-color:var(--green);color:var(--green);}
.srv-badge.warn{background:rgba(234,88,12,0.1);border-color:var(--orange);color:var(--orange);}
.srv-badge.err{background:rgba(220,38,38,0.1);border-color:var(--red);color:var(--red);}
.srv-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

/* 토스트 알림 */
.toast{position:fixed;bottom:20px;right:20px;z-index:99998;padding:9px 14px;border-radius:4px;font-size:11px;background:var(--bg2);border:1px solid var(--bd);color:var(--t1);box-shadow:0 2px 8px rgba(0,0,0,0.15);opacity:0;transition:opacity 0.3s;pointer-events:none;}
.toast.show{opacity:1;}
.toast.error{border-color:var(--red);color:var(--red);}

/* 테마 토글 버튼 */
.btn-theme{background:transparent;border:1px solid var(--bd);color:var(--t2);padding:0;border-radius:3px;font-size:14px;cursor:pointer;line-height:1;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;flex-shrink:0;}
.btn-theme:hover{border-color:var(--blue);color:var(--blue) !important;}
#thresh-btn{width:auto;padding:0 10px;font-size:11px;color:#fff;font-weight:600;}
#theme-toggle{color:#ffd32a;}
body.light #thresh-btn{color:var(--blue);}
body.light #theme-toggle{color:var(--t2);}
.btn-mode{background:transparent;border:1px solid var(--bd);color:var(--t3);padding:1px 6px;border-radius:3px;font-size:10px;cursor:pointer;line-height:1.5;}
.btn-mode:hover{border-color:var(--blue);color:var(--blue);}
.btn-mode.active{background:rgba(108,84,232,0.12);border-color:var(--blue);color:var(--blue);}


.btn-filter{padding:2px 7px;border-radius:3px;font-size:10px;cursor:pointer;border:1px solid var(--bd);background:transparent;color:var(--t3);font-family:inherit;}
.btn-filter:hover{border-color:var(--blue);color:var(--blue);}
.btn-filter.active{background:rgba(108,84,232,0.12);border-color:var(--blue);color:var(--blue);}
.btn-filter.warn.active{background:rgba(255,165,2,0.12);border-color:var(--orange);color:var(--orange);}
.btn-filter.crit.active{background:rgba(255,71,87,0.12);border-color:var(--red);color:var(--red);}


/* 임계치 설정 패널 */
#thresh-panel{display:none;position:fixed;background:var(--bg2);border:1px solid var(--bd);border-radius:8px;padding:14px 16px;z-index:9998;box-shadow:0 4px 20px rgba(0,0,0,0.3);min-width:190px;}
.thresh-panel-title{font-weight:bold;color:var(--t1);font-size:12px;margin-bottom:10px;}
.thresh-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.thresh-label{width:28px;font-size:11px;font-weight:600;}
.thresh-input{width:52px;background:var(--bg3);border:1px solid var(--bd);color:var(--t1);padding:3px 6px;border-radius:3px;font-size:12px;text-align:right;outline:none;}
.thresh-input:focus{border-color:var(--blue);}
.thresh-unit{color:var(--t3);font-size:11px;}
.thresh-apply{width:100%;padding:5px;margin-top:4px;background:rgba(108,84,232,0.12);border:1px solid var(--blue);color:var(--blue);border-radius:3px;cursor:pointer;font-size:11px;font-family:inherit;}
.thresh-apply:hover{background:rgba(108,84,232,0.22);}
</style>
</head>
<body class="light">

<div id="loading-overlay" style="position:fixed;inset:0;background:#f0f3f8;display:flex;align-items:center;justify-content:center;z-index:99999;font-size:13px;color:#2563eb;">
  DB 데이터 로딩 중...
</div>

<div class="hdr">
  <span class="hdr-logo">MaxSpace</span>
  <span class="hdr-sep">|</span>
  <span class="hdr-title">Tablespace 사용량 모니터링</span>

<!-- 임계치 설정 패널 (플로팅) -->

<div class="layout">
  <div class="left">
    <div class="sec sec-db">
      <div class="sec-hdr">
        <span class="sec-title">DB 목록</span>

      <div class="chart-title"><strong>테이블스페이스 사용률</strong><span class="chip" id="chip4">-</span></div>
      <div class="chart-wrap" id="hbarWrap" style="height:calc(100% - 28px);overflow-y:auto;">

      <div class="chart-wrap" style="height:calc(100% - 28px);">
        <canvas id="lineChart" style="width:100%;height:100%;"></canvas>
        <div class="chart-hint" id="hint3">Tablespace를 선택하세요</div>
      </div>
    </div>
  </div>
</div>

<script>
// =====================================================
// SERVER HEALTH BADGE
// =====================================================
function updateHealthBadge() {
  fetch('api/health')
    .then(function(r){ return r.json(); })
    .then(function(h) {
      var badge = document.getElementById('srv-badge');
      if (!badge) return;
      var isHealthy  = h.status === 'healthy';
      var cacheAge   = h.cache && h.cache.age_min != null ? h.cache.age_min : null;
      var trendDone  = h.trend_cache && h.trend_cache.total > 0
                       ? h.trend_cache.count + '/' + h.trend_cache.total
                       : null;
      var label, cls, tip;
      if (!isHealthy) {
        cls   = 'warn';
        label = '초기화 중';
        tip   = '캐시 로딩 중... 트렌드: ' + (trendDone || '-');
      } else {
        cls   = 'ok';
        label = '정상';
        var ageTxt = cacheAge != null
          ? (cacheAge < 60 ? Math.round(cacheAge) + '분 전 갱신' : Math.floor(cacheAge/60) + '시간 전 갱신')
          : '';
        tip = [ageTxt, trendDone ? '트렌드: ' + trendDone : '', '다음 갱신: ' + h.next_refresh]
              .filter(Boolean).join(' | ');
      }
      badge.className = 'srv-badge ' + cls;
      badge.title     = tip;
      badge.innerHTML = '<span class="srv-dot"></span>' + label;
    })
    .catch(function() {
      var badge = document.getElementById('srv-badge');
      if (!badge) return;
      badge.className     = 'srv-badge err';
      badge.title         = '서버 응답 없음';
      badge.innerHTML     = '<span class="srv-dot"></span>서버 오류';
    });
}

// =====================================================
// TOAST
// =====================================================
function showToast(msg, isError) {
  var el = document.getElementById('_toast');
  if (!el) {
    el = document.createElement('div');
    el.id = '_toast';
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.className = 'toast show' + (isError ? ' error' : '');
  el.textContent = msg;
  if (el._t) clearTimeout(el._t);
  el._t = setTimeout(function(){ el.classList.remove('show'); }, 3500);
}

// =====================================================
// COLUMN DEFINITIONS
// =====================================================
var DB_COLS = [
  {id:'db_name',   label:'데이터베이스',  key:'db_name',   align:'left',  w:108, fmt:'db-lnk'},
  {id:'biz_name',  label:'업무명',       key:'biz_name',  align:'left',  w:80,  fmt:'text'},
  {id:'total_gb',  label:'전체 용량',     key:'total_gb',  align:'right', w:80,  fmt:'gb'},
  {id:'used_gb',   label:'사용량',        key:'used_gb',   align:'right', w:80,  fmt:'gb'},
  {id:'free_gb',   label:'남은 용량',     key:'free_gb',   align:'right', w:80,  fmt:'gb'},
  {id:'used_pct',  label:'사용률',        key:'used_pct',  align:'left',  w:100, fmt:'prog'},
  {id:'delta_1w',  label:'1주 전',        key:'delta_1w',  align:'right', w:64,  fmt:'trend'},
  {id:'delta_1m',  label:'1달 전',        key:'delta_1m',  align:'right', w:64,  fmt:'trend'},
  {id:'reach_100', label:'100% 예측일',   key:'reach_100', align:'left',  w:95,  fmt:'reach', info:'보유한 전체 이력 데이터의 사용률 증가 속도를 바탕으로, 현재 추세가 이어질 때 용량이 가득 차는 날짜를 예측합니다.'}
];

var TS_COLS = [
  {id:'db_name',   label:'데이터베이스',   key:'db_name',  align:'left',  w:96,  fmt:'db-lnk'},
  {id:'biz_name',  label:'업무명',         key:'biz_name', align:'left',  w:80,  fmt:'text'},

// =====================================================
// DATA BUILD
// =====================================================
function fmtDate(d) {
  var y = d.getFullYear();
  var m = ('0'+(d.getMonth()+1)).slice(-2);
  var dd = ('0'+d.getDate()).slice(-2);
  return y+'-'+m+'-'+dd;
}
function addDays(d, n) {
  var r = new Date(d.getTime());
  r.setDate(r.getDate() + n);
  return r;
}
function fmtGb(v) {
  if (v >= 1000) return (v/1024).toFixed(1)+'TB';
  return v.toFixed(2)+'GB';
}
function xFmt(labels) {
  if (!labels || labels.length < 2) return 'YYYY-MM';
  var days = Math.round((new Date(labels[labels.length-1]+'T00:00:00') - new Date(labels[0]+'T00:00:00')) / 86400000);
  return days < 90 ? 'MM-DD' : 'YYYY-MM';
}
function applyXFmt(lbl, fmt) {
  if (!lbl) return '';
  return fmt === 'MM-DD' ? lbl.slice(5) : lbl.slice(0, 7);
}

function makeTrend(startPct, endPct, totalGb, days) {
  days = days || 365;
  var arr = [];
  var base_ms = Date.now() - (days - 1) * 86400000;
  for (var i = 0; i < days; i++) {
    var base = startPct + (endPct - startPct) * (i / (days - 1));
    var noise = (Math.random() - 0.5) * 0.8;
    var pct = Math.min(100, Math.max(0, base + noise));
    var d = new Date(base_ms + i * 86400000);
    var dateStr = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    arr.push({ date: dateStr, pct: Math.round(pct*100)/100, used: Math.round(totalGb*pct/100*100)/100 });
  }
  return arr;
}

function calcReach100(trend) {
  if (!trend || trend.length < 2) return null;
  var last = trend[trend.length - 1].pct;
  if (last >= 100) return 0;  // 이미 도달

  var n = trend.length;
  var t0 = new Date(trend[0].date).getTime();
  var sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0;
  for (var i = 0; i < n; i++) {
    var x = Math.round((new Date(trend[i].date).getTime() - t0) / 86400000);
    sumX  += x;
    sumY  += trend[i].pct;
    sumXY += x * trend[i].pct;
    sumX2 += x * x;
  }
  var denom = n * sumX2 - sumX * sumX;
  if (denom === 0) return null;
  var slope = (n * sumXY - sumX * sumY) / denom;

  if (slope <= 0) return -1;  // 증가 없음

  return Math.ceil((100 - last) / slope);  // 남은 일수
}

function buildDb(r) {
  var used_pct = Math.round(r.used_gb / r.total_gb * 10000) / 100;
  var free_gb  = Math.round((r.total_gb - r.used_gb) * 100) / 100;
  var trend    = makeTrend(r.used_pct_1m, used_pct, r.total_gb);
  return {
    product:   r.product,
    biz_name:  r.biz_name,
    db_name:   r.db_name,
    schema:    r.schema,
    total_gb:  r.total_gb,
    used_gb:   r.used_gb,
    free_gb:   free_gb,
    used_pct:  used_pct,
    delta_1w:  Math.round((used_pct - r.used_pct_1w)*100)/100,
    delta_1m:  Math.round((used_pct - r.used_pct_1m)*100)/100,
    reach_100: calcReach100(trend),
    trend:     trend
  };
}

function buildTs(r) {  // UNDO/TEMP는 예측 제외
  if (r.total_gb === 0) {
    return {
      ts_name:r.ts_name, total_gb:0, used_gb:0, free_gb:0,
      used_pct:0, delta_1w:0, delta_1m:0, reach_100:'-', trend:[]
    };
  }
  var used_pct = Math.round(r.used_gb / r.total_gb * 10000) / 100;
  var free_gb  = Math.round((r.total_gb - r.used_gb) * 100) / 100;

  // 실제 트렌드 데이터가 있으면 사용, 없으면 합성
  var trend;
  if (r.trend && r.trend.length >= 10) {
    var trendMap = {};
    for (var ti = 0; ti < r.trend.length; ti++) {
      trendMap[r.trend[ti].date] = r.trend[ti];
    }
    trend = [];
    var lastVal = {pct: used_pct, used: r.used_gb};
    for (var di = 0; di < DATES.length; di++) {
      if (trendMap[DATES[di]]) lastVal = trendMap[DATES[di]];
      trend.push({pct: lastVal.pct, used: lastVal.used});
    }
  } else {
    trend = makeTrend(r.used_pct_1m, used_pct, r.total_gb);
  }
  return {
    ts_name:   r.ts_name,
    total_gb:  r.total_gb,
    used_gb:   r.used_gb,
    free_gb:   free_gb,
    used_pct:  used_pct,
    delta_1w:  Math.round((used_pct - r.used_pct_1w)*100)/100,
    delta_1m:  Math.round((used_pct - r.used_pct_1m)*100)/100,
    reach_100: /^(UNDO|TEMP)/i.test(r.ts_name) ? null : calcReach100(trend),
    trend:     trend
  };
}

var DATES = [];
function rebuildDates() {
  DATES = [];
  for (var di = 0; di < 365; di++) {
    DATES.push(fmtDate(addDays(TODAY, -364 + di)));
  }
}
function rebuildDatesFromTrend(trend) {
  var minDate = null;
  for (var ts in trend) {
    var pts = trend[ts];
    if (pts.length > 0 && (!minDate || pts[0].date < minDate)) minDate = pts[0].date;
  }
  if (!minDate) return;
  DATES = [];
  var cur = new Date(minDate + 'T00:00:00');
  var end = new Date(fmtDate(TODAY) + 'T00:00:00');
  while (cur <= end) { DATES.push(fmtDate(cur)); cur.setDate(cur.getDate() + 1); }
}

function pctClass(p) {
  if (p >= THRESH_CRIT) return 'c-red';
  if (p >= THRESH_WARN) return 'c-orange';
  if (p >= 60) return 'c-yellow';
  if (p >= 30) return 'c-lime';
  return 'c-green';
}
function pctColorHex(p) {
  if (p >= THRESH_CRIT) return '#ff4757';
  if (p >= THRESH_WARN) return '#ffa502';
  if (p >= 60) return '#ffd32a';
  if (p >= 30) return '#7bed9f';
  return '#2ed573';
}
function progBar(pct) {
  var col = pctColorHex(pct);
  var w   = Math.min(pct, 100);
  return '<div class="prog">'
    + '<div class="prog-bg"><div class="prog-fill" style="width:'+w+'%;background:'+col+'"></div></div>'
    + '<span class="prog-pct '+pctClass(pct)+'">'+pct.toFixed(1)+'%</span>'
    + '</div>';
}
function trendBadge(d) {
  if (d > 0.5)  return '<span class="t-up">\u25B2'+d.toFixed(1)+'%</span>';
  if (d < -0.5) return '<span class="t-dn">\u25BC'+Math.abs(d).toFixed(1)+'%</span>';
  return '<span class="t-fl">\u2013</span>';
}
function reachCell(v) {
  if (v === null || v === undefined) return '<span style="color:var(--t3)">-</span>';
  if (v === 0)  return '<span class="c-red">이미 도달</span>';
  if (v === -1) return '<span style="color:var(--t3)">증가 없음</span>';
  if (v > 1000) return '<span style="color:var(--t3)">1000일 이상</span>';
  var cls = v <= 30 ? 'c-red' : v <= 100 ? 'c-yellow' : '';
  return '<span class="' + cls + '">D-' + v + '</span>';
}
function cellHtml(col, row) {
  var v = row[col.key];
  var a = col.align === 'right' ? ' style="text-align:right"' : '';
  var c;
  switch (col.fmt) {
    case 'gb':     c = fmtGb(v); break;
    case 'prog':   c = progBar(v); break;
    case 'trend':  c = trendBadge(v); break;
    case 'reach':  c = reachCell(v); break;
    case 'db-lnk': c = '<span class="db-lnk">'+v+'</span>'; break;
    case 'ts-lnk': c = '<span class="ts-lnk">'+v+'</span>'; break;
    case 't3':     c = '<span style="color:var(--t3)">'+v+'</span>'; break;
    default:       c = v; break;
  }
  return '<td'+a+'>'+c+'</td>';
}

function renderHeader(tableId, cols, sortState, sortFnName) {
  // colgroup — px 비율을 유지하면서 % 너비로 변환해 패널 전체 폭 채움
  var cg = document.getElementById(tableId+'-colgroup');
  var totalW = 0;
  for (var i = 0; i < cols.length; i++) totalW += cols[i].w;
  var cgHtml = '';
  for (var i = 0; i < cols.length; i++) {
    cgHtml += '<col style="width:'+(cols[i].w / totalW * 100).toFixed(2)+'%">';
  }
  cg.innerHTML = cgHtml;
  document.getElementById(tableId).style.width = '100%';

  // thead
  var tr = document.getElementById(tableId+'-thead-row');
  var html = '';
  for (var i = 0; i < cols.length; i++) {
    var c = cols[i];
    var sortCls = '';
    if (sortState.col === c.key) {
      sortCls = sortState.dir === -1 ? 'sort-desc' : 'sort-asc';
    }
    html += '<th data-idx="'+i+'" class="'+sortCls+'">'
      + '<span class="col-grip" draggable="true" data-table="'+tableId+'" data-idx="'+i+'" title="드래그: 순서 변경">\u22EE</span>'
      + '<span class="col-label" onclick="'+sortFnName+'(\''+c.key+'\')">'+c.label+'</span>'
      + (c.info ? '<span class="col-info" data-tip="'+c.info+'">i</span>' : '')
      + '<span class="col-resize" data-table="'+tableId+'" data-idx="'+i+'"></span>'
      + '</th>';
  }
  tr.innerHTML = html;

  initDrag(tableId, cols);
  initResize(tableId, cols);
}

// =====================================================
// DRAG TO REORDER
// =====================================================
function initDrag(tableId, cols) {
  var grips = document.querySelectorAll('#'+tableId+'-thead-row .col-grip');
  var ths   = document.querySelectorAll('#'+tableId+'-thead-row th');

  for (var i = 0; i < grips.length; i++) {
    (function(grip) {
      grip.addEventListener('dragstart', function(e) {
        dragState = { tableId: tableId, idx: parseInt(grip.dataset.idx) };
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', grip.dataset.idx);
        var th = grip.parentElement;
        try { e.dataTransfer.setDragImage(th, Math.floor(th.offsetWidth/2), 10); } catch(ex){}
        setTimeout(function(){ th.classList.add('dragging'); }, 0);
      });
      grip.addEventListener('dragend', function() {
        var allTh = document.querySelectorAll('#'+tableId+'-thead-row th');
        for (var j = 0; j < allTh.length; j++) {
          allTh[j].classList.remove('dragging', 'drag-over');
        }
        dragState = null;
      });
    })(grips[i]);
  }

  for (var i = 0; i < ths.length; i++) {
    (function(th) {
      th.addEventListener('dragover', function(e) {
        if (!dragState || dragState.tableId !== tableId) return;
        e.preventDefault();
        var allTh = document.querySelectorAll('#'+tableId+'-thead-row th');
        for (var j = 0; j < allTh.length; j++) allTh[j].classList.remove('drag-over');
        th.classList.add('drag-over');
      });
      th.addEventListener('dragleave', function() { th.classList.remove('drag-over'); });
      th.addEventListener('drop', function(e) {
        e.preventDefault();
        if (!dragState || dragState.tableId !== tableId) return;
        var from = dragState.idx;
        var to   = parseInt(th.dataset.idx);
        dragState = null;
        if (from === to) return;
        var arr  = tableId === 'db-table' ? DB_COLS : TS_COLS;
        var moved = arr.splice(from, 1)[0];
        arr.splice(to, 0, moved);
        if (tableId === 'db-table') renderDbTable();
        else renderTsTable();
      });
    })(ths[i]);
  }
}

// =====================================================
// RESIZE COLUMNS
// =====================================================
function initResize(tableId, cols) {
  var handles = document.querySelectorAll('#'+tableId+'-thead-row .col-resize');
  for (var i = 0; i < handles.length; i++) {
    (function(handle) {
      handle.addEventListener('mousedown', function(e) {
        e.preventDefault();
        e.stopPropagation();
        var idx    = parseInt(handle.dataset.idx);
        var startX = e.clientX;
        var startW = cols[idx].w;
        handle.classList.add('active');
        document.body.classList.add('col-resizing');

        function onMove(ev) {
          var newW = Math.max(40, startW + ev.clientX - startX);
          cols[idx].w = newW;
          var total = 0;
          for (var j = 0; j < cols.length; j++) total += cols[j].w;
          var colEls = document.querySelectorAll('#'+tableId+'-colgroup col');
          for (var j = 0; j < colEls.length; j++) {
            colEls[j].style.width = (cols[j].w / total * 100).toFixed(2) + '%';
          }
          // table은 항상 100% 유지
        }
        function onUp() {
          handle.classList.remove('active');
          document.body.classList.remove('col-resizing');
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
        }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    })(handles[i]);
  }
}

// RENDER DB TABLE
// =====================================================
function renderDbTable() {
  renderHeader('db-table', DB_COLS, dbSort, 'sortDb');

  var q = document.getElementById('db-search').value.toLowerCase();
  var rows = [];
  for (var i = 0; i < DBS.length; i++) {
    var d = DBS[i];
    if (dbFilterMode === 'crit' && d.used_pct < THRESH_CRIT) continue;
    if (dbFilterMode === 'warn' && d.used_pct < THRESH_WARN) continue;
    if (!q || d.db_name.toLowerCase().indexOf(q) >= 0 || d.schema.toLowerCase().indexOf(q) >= 0 || d.biz_name.toLowerCase().indexOf(q) >= 0) {
      rows.push(d);
    }
  }
  var countEl = document.getElementById('db-count');
  if (countEl) countEl.textContent = '전체 ' + rows.length + '개';
  var col = dbSort.col, dir = dbSort.dir;
  rows.sort(function(a,b){ return dir*(a[col]>b[col]?1:a[col]<b[col]?-1:0); });

  var html = '';
  for (var i = 0; i < rows.length; i++) {
    var d = rows[i];
    var thCls = d.used_pct >= THRESH_CRIT ? 'row-crit' : d.used_pct >= THRESH_WARN ? 'row-warn' : '';
    var cls = selDb === d.db_name ? ('selected' + (thCls ? ' ' + thCls : '')) : thCls;
    html += '<tr data-db="'+d.db_name+'" onclick="selectDb(\''+d.db_name+'\')"' + (cls ? ' class="'+cls+'"' : '') + '>';
    for (var j = 0; j < DB_COLS.length; j++) html += cellHtml(DB_COLS[j], d);
    html += '</tr>';
  }
  document.getElementById('db-tbody').innerHTML = html;
  document.getElementById('db-date').textContent = '최신 데이터 기준일: ' + fmtDate(TODAY);
}

function sortDb(col) {
  if (dbSort.col === col) dbSort.dir *= -1;
  else { dbSort.col = col; dbSort.dir = -1; }
  renderDbTable();
}



// =====================================================
// RENDER TS TABLE
// =====================================================
function renderTsTable() {
  renderHeader('ts-table', TS_COLS, tsSort, 'sortTs');
  var tbody = document.getElementById('ts-tbody');

  var q = document.getElementById('ts-search').value.toLowerCase();

  // db_name → biz_name 룩업맵
  var bizMap = {};
  for (var bi = 0; bi < DBS.length; bi++) { bizMap[DBS[bi].db_name] = DBS[bi].biz_name; }

  // 모든 DB의 tablespace 수집 (db_name, biz_name 필드 포함)
  var rows = [];
  for (var dbName in TSS) {
    var list = TSS[dbName];
    for (var i = 0; i < list.length; i++) {
      var t = list[i];
      if (tsFilterMode === 'crit' && t.used_pct < THRESH_CRIT) continue;
      if (tsFilterMode === 'warn' && t.used_pct < THRESH_WARN) continue;
      var biz = bizMap[dbName] || '-';
      if (!q || t.ts_name.toLowerCase().indexOf(q) >= 0
              || dbName.toLowerCase().indexOf(q) >= 0
              || biz.toLowerCase().indexOf(q) >= 0) {
        var row = {};
        for (var k in t) row[k] = t[k];
        row.db_name  = dbName;
        row.biz_name = biz;
        rows.push(row);
      }
    }
  }

  // 정렬: 기본은 사용률 내림차순, 헤더 클릭 시 해당 컬럼
  var col = tsSort.col, dir = tsSort.dir;
  rows.sort(function(a, b) { return dir * (a[col] > b[col] ? 1 : a[col] < b[col] ? -1 : 0); });

  // 헤더 카운트 업데이트
  var countEl = document.getElementById('ts-count');
  if (countEl) countEl.textContent = '전체 ' + rows.length + '개';

  var html = '';
  for (var i = 0; i < rows.length; i++) {
    var t = rows[i];
    var thCls = t.used_pct >= THRESH_CRIT ? 'row-crit' : t.used_pct >= THRESH_WARN ? 'row-warn' : '';
    var cls = (selDb === t.db_name && selTs === t.ts_name) ? ('selected' + (thCls ? ' ' + thCls : '')) : thCls;
    html += '<tr data-db="'+t.db_name+'" data-ts="'+t.ts_name+'" onclick="selectDbTs(\''+t.db_name+'\',\''+t.ts_name+'\')"' + (cls ? ' class="'+cls+'"' : '') + '>';
    for (var j = 0; j < TS_COLS.length; j++) html += cellHtml(TS_COLS[j], t);
    html += '</tr>';
  }
  tbody.innerHTML = html;
}

// =====================================================
// 트렌드 캐시 { db: { ts_name: [{date,pct,used},...] } }
var TREND_CACHE   = {};
var TREND_PENDING = {};  // 비행 중인 요청 { db: [callbacks] }

function fetchTrend(db, callback) {
  // 이미 캐시 있으면 즉시 반환
  if (TREND_CACHE[db]) { if (callback) callback(TREND_CACHE[db]); return; }

  // 이미 요청 중이면 콜백만 등록
  if (TREND_PENDING[db]) { if (callback) TREND_PENDING[db].push(callback); return; }

  // 새 요청 시작
  TREND_PENDING[db] = callback ? [callback] : [];
  fetch('api/trend?db=' + encodeURIComponent(db))
    .then(function(r){
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(resp) {
      var cbs = TREND_PENDING[db] || [];
      delete TREND_PENDING[db];
      if (!resp.ok) throw new Error(resp.error || 'trend API 오류');
      TREND_CACHE[db] = resp.trend;
      for (var i = 0; i < cbs.length; i++) cbs[i](resp.trend);
    })
    .catch(function(e) {
      var cbs = TREND_PENDING[db] || [];
      delete TREND_PENDING[db];
      console.warn('[trend]', db, e);
      // 현재 선택된 DB라면 차트 영역에 오류 표시
      if (selDb === db) {
        var h2 = document.getElementById('hint2');
        var h3 = document.getElementById('hint3');
        var h4 = document.getElementById('hint4');
        if (h2) { h2.textContent = '트렌드 로드 실패 (DB 재클릭하면 재시도)'; h2.style.display = ''; }
        if (h3) { h3.textContent = '트렌드 로드 실패'; h3.style.display = ''; }
        if (h4) { h4.textContent = '트렌드 로드 실패'; h4.style.display = ''; }
      }
      showToast('트렌드 로드 실패: ' + db, true);
    });
}

// 사용률 상위 5개 DB 트렌드만 선제 로드 (서버 캐시가 주 성능원)
function prefetchAllTrends() {
  var top = DBS.slice().sort(function(a, b) { return b.used_pct - a.used_pct; }).slice(0, 5);
  for (var i = 0; i < top.length; i++) {
    (function(dbName) {
      fetchTrend(dbName, function(trend) {
        var list = TSS[dbName] || [];
        for (var j = 0; j < list.length; j++) {
          list[j].trend = trend[list[j].ts_name] || [];
        }
        if (selDb === dbName && chartReady()) {
          rebuildDatesFromTrend(trend);
          drawBar(); drawHBar();
        }
      });
    })(top[i].db_name);
  }
}

function updateSelHighlight() {
  var dbRows = document.querySelectorAll('#db-tbody tr');
  for (var i = 0; i < dbRows.length; i++) {
    dbRows[i].classList.toggle('selected', dbRows[i].dataset.db === selDb);
  }
  var tsRows = document.querySelectorAll('#ts-tbody tr');
  for (var i = 0; i < tsRows.length; i++) {
    var r = tsRows[i];
    r.classList.toggle('selected', r.dataset.db === selDb && r.dataset.ts === selTs);
  }
}

function selectDb(name) {
  selDb = name; selTs = null;
  updateSelHighlight();
  document.getElementById('chip2').textContent = name;
  document.getElementById('chip3').textContent = '-';
  clearLine();

  // 캐시/프리페치 여부에 따라 로딩 표시
  if (!TREND_CACHE[name] && !TREND_PENDING[name]) {
    document.getElementById('hint2').textContent = '트렌드 로딩 중...';
    document.getElementById('hint2').style.display = '';
  } else if (TREND_CACHE[name] && chartReady()) {
    // 이미 캐시 있으면 즉시 그리기
    var list = TSS[name] || [];
    for (var i = 0; i < list.length; i++) {
      list[i].trend = TREND_CACHE[name][list[i].ts_name] || [];
    }
    rebuildDatesFromTrend(TREND_CACHE[name]);
    drawBar(); drawHBar(); return;
  }

  fetchTrend(name, function(trend) {
    if (selDb !== name) return;  // 로딩 중 다른 DB로 전환된 경우 무시
    var list = TSS[name] || [];
    for (var i = 0; i < list.length; i++) {
      list[i].trend = trend[list[i].ts_name] || [];
    }
    rebuildDatesFromTrend(trend);
    drawBar();
    drawHBar();
  });
}

// TS 그리드 행 클릭 — DB + TS 동시 선택
function selectDbTs(dbName, tsName) {
  var dbChanged = (selDb !== dbName);
  selDb = dbName; selTs = tsName;
  updateSelHighlight();
  document.getElementById('chip2').textContent = dbName;
  document.getElementById('chip3').textContent = tsName;
  fetchTrend(dbName, function(trend) {
    var list = TSS[dbName] || [];
    for (var i = 0; i < list.length; i++) {
      list[i].trend = trend[list[i].ts_name] || [];
    }
    rebuildDatesFromTrend(trend);
    if (dbChanged) { drawBar(); }
    drawHBar();
    drawLine();
  });
}

// =====================================================
// THEME TOGGLE
// =====================================================
function isLight() { return document.body.classList.contains('light'); }

function tc() {  // theme colors
  var l = isLight();
  return {
    grid:         l ? '#dde3ef' : '#1e2440',
    tick:         l ? '#374151' : '#ffffff',
    tickMuted:    l ? '#6b7280' : '#8890a8',
    tooltipBg:    l ? '#ffffff' : '#1c2233',
    tooltipBd:    l ? '#d1d5db' : '#2a3050',
    tooltipTitle: l ? '#111827' : '#c8cdd8',
    tooltipBody:  l ? '#4b5563' : '#8890a8',
    capLine:      l ? '#00000055' : '#ffffffaa'
  };
}

function toggleTheme() {
  document.body.classList.toggle('light');
  var btn = document.getElementById('theme-toggle');
  btn.textContent = isLight() ? '🌙' : '☀';
  // 활성 차트 다시 그리기
  if (chartReady()) {
    if (selDb) { drawBar(); drawHBar(); }
    if (selTs) drawLine();
  }
}

// =====================================================
// CHARTS (loaded async - graceful fallback)
// =====================================================
var PALETTE = ['#4a9eff','#00c9b0','#ff4757','#ffa502','#ffd32a',
               '#7bed9f','#a29bfe','#fd79a8','#55efc4','#fdcb6e'];

function chartReady() { return typeof Chart !== 'undefined'; }

function destroyChart(id) {
  if (CHARTS[id]) { try { CHARTS[id].destroy(); } catch(e){} CHARTS[id] = null; }
  if (id === 'barChart') {
    var el = document.getElementById('barTooltip');
    if (el) el.style.display = 'none';
  }
}

function drawDonut() {
  if (!selDb) return;
  document.getElementById('hint1').style.display = 'none';
  if (!chartReady()) { document.getElementById('hint1').textContent='차트 로딩 중...'; document.getElementById('hint1').style.display=''; return; }

  var list = (TSS[selDb] || []).filter(function(t){ return t.used_gb > 0; });
  list.sort(function(a,b){ return b.used_gb - a.used_gb; });

  var top = list.slice(0, 15);
  var etc = 0;
  for (var i = 15; i < list.length; i++) etc += list[i].used_gb;
  etc = Math.round(etc*100)/100;

  var labels = top.map(function(t){ return t.ts_name; });
  var data   = top.map(function(t){ return t.used_gb; });
  if (etc > 0) { labels.push('기타'); data.push(etc); }

  var total = 0; for (var i = 0; i < data.length; i++) total += data[i];
  var bg = [];
  for (var i = 0; i < labels.length; i++) {
    bg.push(i < 15 ? PALETTE[i % PALETTE.length]+'cc' : '#636e72cc');
  }

  destroyChart('donutChart');
  CHARTS['donutChart'] = new Chart(document.getElementById('donutChart').getContext('2d'), {
    type: 'doughnut',
    data: { labels: labels, datasets: [{ data: data, backgroundColor: bg, borderColor: '#0e1117', borderWidth: 2, hoverOffset: 4 }] },
    options: {
      responsive: true, maintainAspectRatio: false, animation: { duration: 400 }, cutout: '58%',
      plugins: {
        legend: {
          display: true, position: 'right',
          labels: { color: '#8890a8', font: { size: 9 }, boxWidth: 9, padding: 4,
            generateLabels: function(chart) {
              var ds = chart.data.datasets[0];
              return chart.data.labels.map(function(lbl, i) {
                var pct = (ds.data[i] / total * 100).toFixed(1);
                return { text: lbl+'  '+fmtGb(ds.data[i])+' ('+pct+'%)', fillStyle: ds.backgroundColor[i], strokeStyle: 'transparent', index: i };
              });
            }
          }
        },
        tooltip: {
          backgroundColor: '#1c2233', borderColor: '#2a3050', borderWidth: 1,
          titleColor: '#c8cdd8', bodyColor: '#8890a8',
          callbacks: { label: function(ctx){ return '  '+fmtGb(ctx.parsed)+'  ('+(ctx.parsed/total*100).toFixed(1)+'%)'; } }
        }
      }
    }
  });
}

// =====================================================
// DB 총 사용량 요약 — 페이지 로드 직후 자동 표시
// =====================================================
function drawDbSummary() {
  if (!DBS.length) return;
  document.getElementById('hint2').style.display = 'none';
  if (!chartReady()) return;

  var list = DBS.slice().sort(function(a,b){ return b.used_pct - a.used_pct; });
  var labels  = list.map(function(d){ return d.db_name; });
  var usedArr = list.map(function(d){ return d.used_gb; });
  var freeArr = list.map(function(d){ return d.free_gb; });
  var colors  = list.map(function(d){ return pctColorHex(d.used_pct) + 'cc'; });

  var t = tc();
  destroyChart('barChart');
  var oldCanvas = document.getElementById('barChart');
  var wrap = oldCanvas.parentElement;
  var newCanvas = document.createElement('canvas');
  newCanvas.id = 'barChart';
  newCanvas.style.width = '100%';
  newCanvas.style.height = '100%';
  wrap.replaceChild(newCanvas, oldCanvas);

  CHARTS['barChart'] = new Chart(newCanvas.getContext('2d'), {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [
        {
          label: '사용량',
          data: usedArr,
          backgroundColor: colors,
          borderWidth: 0,
          borderRadius: 2,
          stack: 's'
        },
        {
          label: '여유 공간',
          data: freeArr,
          backgroundColor: t.grid,
          borderWidth: 0,
          borderRadius: 2,
          stack: 's'
        }
      ]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 300 },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: t.tooltipBg, borderColor: t.tooltipBd, borderWidth: 1,
          titleColor: t.tooltipTitle, bodyColor: t.tooltipBody,
          callbacks: {
            title: function(items){ return items[0].label; },
            label: function(ctx) {
              var d = list[ctx.dataIndex];
              if (ctx.datasetIndex === 0)
                return '  사용: ' + fmtGb(d.used_gb) + '  (' + d.used_pct.toFixed(1) + '%)';
              return '  여유: ' + fmtGb(d.free_gb);
            },
            footer: function(items){
              var d = list[items[0].dataIndex];
              return '  전체: ' + fmtGb(d.total_gb);
            }
          }
        }
      },
      scales: {
        x: {
          stacked: true,
          grid: { color: t.grid },
          ticks: { color: t.tickMuted, font: { size: 9 }, callback: function(v){ return fmtGb(v); } }
        },
        y: {
          stacked: true,
          grid: { display: false },
          ticks: { color: t.tick, font: { size: 10 } }
        }
      }
    }
  });
}

function drawBar() {
  if (!selDb) return;
  document.getElementById('hint2').style.display = 'none';
  if (!chartReady()) return;

  var list = TSS[selDb] || [];
  if (!list.length) return;

  var totalGb = 0;
  for (var i = 0; i < list.length; i++) totalGb += list[i].total_gb;

  var active = list.filter(function(t){ return t.total_gb > 0 && t.trend && t.trend.length; });
  if (!active.length) return;

  // 실제 trend 데이터의 date 필드가 있으면 DATES를 실제 범위로 재계산
  var trendObjForDates = {};
  for (var ri = 0; ri < active.length; ri++) {
    if (active[ri].trend.length > 0 && active[ri].trend[0].date) {
      trendObjForDates[active[ri].ts_name] = active[ri].trend;
    }
  }
  if (Object.keys(trendObjForDates).length > 0) rebuildDatesFromTrend(trendObjForDates);

  var datasets = [];
  for (var ti = 0; ti < active.length; ti++) {
    var ts = active[ti];
    // date → used 맵 생성
    var trendMap = {};
    for (var di = 0; di < ts.trend.length; di++) {
      trendMap[ts.trend[di].date] = ts.trend[di].used;
    }
    var dailyData = [];
    for (var di = 0; di < DATES.length; di++) {
      dailyData.push(trendMap[DATES[di]] !== undefined ? trendMap[DATES[di]] : 0);
    }
    var col = PALETTE[ti % PALETTE.length];
    datasets.push({
      label: ts.ts_name, data: dailyData,
      backgroundColor: col + 'cc', borderColor: col,
      borderWidth: 0, stack: 'usage'
    });
  }

  // 전체 용량 점선
  var capVal = Math.round(totalGb * 100) / 100;
  datasets.push({
    label: '전체 용량', data: Array(DATES.length).fill(capVal),
    type: 'line', borderColor: tc().capLine, borderDash: [5,4],
    borderWidth: 1.5, pointRadius: 0, fill: false, stack: null, order: -1
  });

  // canvas 교체 — 이전 픽셀 버퍼 초기화
  destroyChart('barChart');
  var oldCanvas = document.getElementById('barChart');
  var wrap = oldCanvas.parentElement;
  var newCanvas = document.createElement('canvas');
  newCanvas.id = 'barChart';
  newCanvas.style.width = '100%';
  newCanvas.style.height = '100%';
  wrap.replaceChild(newCanvas, oldCanvas);
  var canvas = newCanvas;

  CHARTS['barChart'] = new Chart(canvas.getContext('2d'), {
    type: 'bar',
    data: { labels: DATES, datasets: datasets },
    options: {
      responsive: true, maintainAspectRatio: false, animation: { duration: 0 },
      plugins: {
        legend: { display: true, position: 'bottom',
          labels: { color: tc().tickMuted, font:{size:9}, boxWidth:8, padding:4,
            filter: function(item){ return item.text !== '전체 용량'; }
          }
        },
        tooltip: {
          enabled: false,
          mode: 'index', intersect: false,
          external: function(context) {
            var t = tc();
            var tooltipEl = document.getElementById('barTooltip');
            if (!tooltipEl) {
              tooltipEl = document.createElement('div');
              tooltipEl.id = 'barTooltip';
              document.body.appendChild(tooltipEl);
            }
            tooltipEl.style.cssText = 'position:fixed;pointer-events:none;z-index:9999;'
              + 'background:'+t.tooltipBg+';border:1px solid '+t.tooltipBd+';border-radius:4px;'
              + 'padding:8px 10px;font-size:11px;white-space:nowrap;display:none;';

            var tooltip = context.tooltip;
            if (!tooltip || tooltip.opacity === 0) {
              tooltipEl.style.display = 'none';
              return;
            }

            // 제목
            var html = '<div style="color:'+t.tooltipTitle+';font-weight:bold;margin-bottom:5px">'
              + (tooltip.title[0] || '') + '</div>';

            // 각 TS 항목
            var bodyLines = tooltip.body || [];
            var labelColors = tooltip.labelColors || [];
            for (var i = 0; i < bodyLines.length; i++) {
              var line = (bodyLines[i].lines || [])[0] || '';
              var color = (labelColors[i] && labelColors[i].backgroundColor) || t.tickMuted;
              html += '<div style="color:'+t.tooltipBody+';display:flex;align-items:center;gap:5px;margin:1px 0">'
                + '<span style="display:inline-block;width:8px;height:8px;background:'+color+';border-radius:1px;flex-shrink:0"></span>'
                + '<span>' + line + '</span></div>';
            }

            // footer
            if (tooltip.footer && tooltip.footer.length) {
              html += '<div style="color:'+t.tooltipTitle+';margin-top:5px;padding-top:5px;border-top:1px solid '+t.tooltipBd+'">'
                + tooltip.footer[0] + '</div>';
            }

            tooltipEl.innerHTML = html;
            tooltipEl.style.display = 'block';

            // viewport 기준 위치 계산 — 경계 자동 감지해 좌우 전환
            var rect = context.chart.canvas.getBoundingClientRect();
            var cx = rect.left + tooltip.caretX;
            var cy = rect.top  + tooltip.caretY;
            var tw = tooltipEl.offsetWidth;
            var th = tooltipEl.offsetHeight;
            var ww = window.innerWidth;
            var wh = window.innerHeight;
            var gap = 12;

            var left = cx + gap;
            if (left + tw > ww - gap) left = cx - tw - gap;
            if (left < gap) left = gap;

            var top = cy - th / 2;
            if (top < gap) top = gap;
            if (top + th > wh - gap) top = wh - th - gap;

            tooltipEl.style.left = left + 'px';
            tooltipEl.style.top  = top  + 'px';
          },
          callbacks: {
            label: function(ctx){
              if (ctx.dataset.label === '전체 용량') return ' 전체 용량: ' + fmtGb(ctx.parsed.y);
              var daySum = 0;
              var ds = ctx.chart.data.datasets;
              for (var i = 0; i < ds.length; i++) {
                if (ds[i].label !== '전체 용량') daySum += ds[i].data[ctx.dataIndex] || 0;
              }
              var pct = daySum > 0 ? (ctx.parsed.y / daySum * 100).toFixed(1) : '0.0';
              return ctx.dataset.label + ': ' + fmtGb(ctx.parsed.y) + ' (' + pct + '%)';
            },
            footer: function(items){
              var sum = 0;
              items.forEach(function(i){ if (i.dataset.label !== '전체 용량') sum += i.parsed.y; });
              return '사용 합계: ' + fmtGb(sum) + ' / ' + fmtGb(totalGb);
            }
          }
        }
      },
      scales: {
        x: { stacked: true, grid: { color: tc().grid },
          afterBuildTicks: (function(){ var fmt=xFmt(DATES); return function(axis){ var all=[],seen={}; for(var i=0;i<DATES.length;i++){var k=applyXFmt(DATES[i]||'',fmt);if(k&&!seen[k]){seen[k]=true;all.push({value:i});}} var cw=(axis.chart.chartArea&&axis.chart.chartArea.width)||300; var lw=fmt==='MM-DD'?28:36; var minGap=Math.ceil(lw*DATES.length/cw); var tks=[],last=-9999; for(var i=0;i<all.length;i++){if(all[i].value-last>=minGap){tks.push(all[i]);last=all[i].value;}} axis.ticks=tks.length?tks:all.slice(0,1); }; })(),
          ticks: { color: tc().tick, font:{size:9},
            callback: (function(){ var fmt=xFmt(DATES); return function(val){ return applyXFmt(DATES[val]||'',fmt); }; })()
          }
        },
        y: { stacked: true, grid: { color: tc().grid }, min: 0,
          ticks: { color: tc().tick, font:{size:9}, callback: function(v){ return fmtGb(v); } }
        }
      }
    }
  });
}

// =====================================================
// DRAG-TO-ZOOM PLUGIN (lineChart 전용)
// =====================================================
var _dragZoomPlugin = {
  id: 'dragZoom',
  afterInit: function(chart) {
    chart._dz = { active: false, startX: 0, endX: 0, zoomed: false };
    var canvas = chart.canvas;
    canvas.style.cursor = 'crosshair';

    canvas.addEventListener('mousedown', function(e) {
      if (e.button !== 0) return;
      var r = canvas.getBoundingClientRect();
      chart._dz.active = true;
      chart._dz.startX = e.clientX - r.left;
      chart._dz.endX   = chart._dz.startX;
    });

    canvas.addEventListener('mousemove', function(e) {
      if (!chart._dz.active) return;
      var r = canvas.getBoundingClientRect();
      chart._dz.endX = e.clientX - r.left;
      chart.draw();
    });

    chart._dz._upHandler = function(e) {
      if (!chart._dz.active) return;
      chart._dz.active = false;
      var sx = chart._dz.startX, ex = chart._dz.endX;
      if (Math.abs(ex - sx) < 5) { chart.draw(); return; }
      var ca = chart.chartArea;
      var minPx = Math.max(ca.left, Math.min(ca.right, Math.min(sx, ex)));
      var maxPx = Math.max(ca.left, Math.min(ca.right, Math.max(sx, ex)));
      var scale = chart.scales.x;
      var minI  = Math.max(0, Math.round(scale.getValueForPixel(minPx)));
      var maxI  = Math.min(chart.data.labels.length - 1, Math.round(scale.getValueForPixel(maxPx)));
      if (maxI <= minI) { chart.draw(); return; }
      chart.options.scales.x.min = chart.data.labels[minI];
      chart.options.scales.x.max = chart.data.labels[maxI];
      chart._dz.zoomed = true;
      document.getElementById('line-zoom-reset').style.display = '';
      document.getElementById('line-pan-left').style.display = '';
      document.getElementById('line-pan-right').style.display = '';
      chart.update('none');
    };
    document.addEventListener('mouseup', chart._dz._upHandler);
  },

  afterDraw: function(chart) {
    if (!chart._dz || !chart._dz.active) return;
    var sx = chart._dz.startX, ex = chart._dz.endX;
    var ca = chart.chartArea;
    var ctx = chart.ctx;
    ctx.save();
    ctx.fillStyle   = 'rgba(108,84,232,0.15)';
    ctx.strokeStyle = 'rgba(108,84,232,0.7)';
    ctx.lineWidth   = 1;
    var x  = Math.max(ca.left, Math.min(ca.right, Math.min(sx, ex)));
    var x2 = Math.max(ca.left, Math.min(ca.right, Math.max(sx, ex)));
    var w = x2 - x;
    ctx.fillRect(x, ca.top, w, ca.bottom - ca.top);
    ctx.strokeRect(x, ca.top, w, ca.bottom - ca.top);
    ctx.restore();
  },

  beforeDestroy: function(chart) {
    if (chart._dz && chart._dz._upHandler) {
      document.removeEventListener('mouseup', chart._dz._upHandler);
    }
  }
};

// 확장 이력 플러그인 (total_space 증가 감지)
var _expansionPlugin = {
  id: 'expansion',
  afterDraw: function(chart) {
    var idxs = chart._expansionIndices;
    if (!idxs || !idxs.length) return;
    var ca = chart.chartArea, xs = chart.scales.x, ctx = chart.ctx;
    ctx.save();
    for (var i = 0; i < idxs.length; i++) {
      var lbl = chart.data.labels[idxs[i]];
      if (!lbl) continue;
      var px = xs.getPixelForValue(lbl);
      if (px === undefined || px < ca.left || px > ca.right) continue;
      ctx.beginPath();
      ctx.moveTo(px, ca.top + 14);
      ctx.lineTo(px, ca.bottom);
      ctx.strokeStyle = 'rgba(0,201,176,0.55)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([3, 3]);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(px, ca.top + 3);
      ctx.lineTo(px - 5, ca.top + 13);
      ctx.lineTo(px + 5, ca.top + 13);
      ctx.closePath();
      ctx.fillStyle = '#00c9b0';
      ctx.fill();
    }
    ctx.restore();
  }
};

var _crosshairPlugin = {
  id: 'crosshair',
  afterDraw: function(chart) {

    if (!active) return;

function panLine(dir) {
  var chart = CHARTS['lineChart'];
  if (!chart || !chart._dz || !chart._dz.zoomed) return;
  var labels = chart.data.labels;
  var curMin = chart.options.scales.x.min;
  var curMax = chart.options.scales.x.max;
  var minI = labels.indexOf(curMin);
  var maxI = labels.indexOf(curMax);
  if (minI < 0) minI = 0;
  if (maxI < 0) maxI = labels.length - 1;
  var windowSize = maxI - minI;
  var step = Math.max(1, Math.round(windowSize / 3));
  var newMinI, newMaxI;
  if (dir === 'left') {
    newMinI = Math.max(0, minI - step);
    newMaxI = newMinI + windowSize;
  } else {
    newMaxI = Math.min(labels.length - 1, maxI + step);
    newMinI = newMaxI - windowSize;
  }
  newMinI = Math.max(0, newMinI);
  newMaxI = Math.min(labels.length - 1, newMaxI);
  chart.options.scales.x.min = labels[newMinI];
  chart.options.scales.x.max = labels[newMaxI];
  chart.update('none');
}

var _hbarThreshPlugin = {
  id: 'hbarThresh',
  afterDraw: function(chart) {
    var ca = chart.chartArea, xs = chart.scales.x, ctx = chart.ctx;
    ctx.save();
    ctx.setLineDash([4, 3]);
    ctx.lineWidth = 1.5;
    var lines = [
      { val: THRESH_WARN, color: '#ffa502', label: THRESH_WARN + '%' },
      { val: THRESH_CRIT, color: '#ff4757', label: THRESH_CRIT + '%' }
    ];
    for (var i = 0; i < lines.length; i++) {
      var px = xs.getPixelForValue(lines[i].val);
      if (px < ca.left || px > ca.right) continue;
      ctx.beginPath();
      ctx.moveTo(px, ca.top);
      ctx.lineTo(px, ca.bottom);
      ctx.strokeStyle = lines[i].color;
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = lines[i].color;
      ctx.font = 'bold 9px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(lines[i].label, px + 2, ca.top + 10);
      ctx.setLineDash([4, 3]);
    }
    ctx.restore();
  }
};

// HBAR CHART — 테이블스페이스 사용률 (당일 기준)
// =====================================================
function drawHBar() {
  if (!selDb) return;
  var list = (TSS[selDb] || []).filter(function(t){ return t.total_gb > 0; });
  if (!list.length) return;

  list.sort(function(a,b){ return b.used_pct - a.used_pct; });

  document.getElementById('hint4').style.display = 'none';
  document.getElementById('chip4').textContent = selDb;
  if (!chartReady()) return;

  var top10 = list.slice(0, 10);
  var rest  = list.slice(10);
  var displayList = top10.slice();
  if (rest.length > 0) {
    var etcPct = 0;
    for (var i = 0; i < rest.length; i++) etcPct += rest[i].used_pct;
    etcPct = Math.round(etcPct / rest.length * 100) / 100;
    displayList.push({ ts_name: '기타 (' + rest.length + '개)', used_pct: etcPct, _etc: true });
  }

  var isEtcSelected = selTs && rest.some(function(t){ return t.ts_name === selTs; });

  var labels  = displayList.map(function(t){ return t.ts_name; });
  var data    = displayList.map(function(t){ return t.used_pct; });
  var colors  = displayList.map(function(t){
    if (t._etc) return isEtcSelected ? '#74b9ff' : '#74b9ff80';
    return t.ts_name === selTs ? pctColorHex(t.used_pct) : pctColorHex(t.used_pct) + '50';
  });
  var borders = displayList.map(function(t){ return t._etc ? '#74b9ff' : pctColorHex(t.used_pct); });
  var bwidths = displayList.map(function(t){
    if (t._etc) return isEtcSelected ? 2 : 1;
    return t.ts_name === selTs ? 2 : 1;
  });

  destroyChart('hbarChart');
  var oldCanvas = document.getElementById('hbarChart');
  var newCanvas = document.createElement('canvas');
  newCanvas.id = 'hbarChart';
  newCanvas.style.width = '100%';
  newCanvas.style.height = '100%';
  oldCanvas.parentElement.replaceChild(newCanvas, oldCanvas);

  var t = tc();
  CHARTS['hbarChart'] = new Chart(newCanvas.getContext('2d'), {
    type: 'bar',
    plugins: [_hbarThreshPlugin],
    data: {
      labels: labels,
      datasets: [{
        data: data,
        backgroundColor: colors,
        borderColor: borders,
        borderWidth: bwidths,
        borderRadius: 2
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 300 },
      onClick: function(event, elements) {
        if (!elements.length) return;
        var item = displayList[elements[0].index];
        if (item._etc) return;
        selectDbTs(selDb, item.ts_name);
      },
      onHover: function(event, elements) {
        event.native.target.style.cursor = elements.length ? 'pointer' : 'default';
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: t.tooltipBg, borderColor: t.tooltipBd, borderWidth: 1,
          titleColor: t.tooltipTitle, bodyColor: t.tooltipBody,
          callbacks: {
            label: function(ctx) {
              var ts = displayList[ctx.dataIndex];
              if (ts._etc) return '  평균 ' + ctx.parsed.x.toFixed(1) + '%';
              return '  ' + ctx.parsed.x.toFixed(1) + '%  (' + fmtGb(ts.used_gb) + ' / ' + fmtGb(ts.total_gb) + ')';
            }
          }
        }
      },
      scales: {
        x: {
          min: 0, max: 100,
          grid: { color: t.grid },
          ticks: { color: t.tickMuted, font: { size: 9 }, callback: function(v){ return v + '%'; } }
        },
        y: {
          grid: { display: false },
          ticks: { color: t.tick, font: { size: 9 }, autoSkip: false }
        }
      }
    }
  });
}

// EXPORT CSV
// =====================================================
function exportCsv(type) {
  var cols, rows, filename;
  if (type === 'db') {
    cols = DB_COLS; rows = DBS; filename = 'db_tablespace_summary.csv';
  } else {
    cols = TS_COLS;
    rows = [];
    for (var dbN in TSS) {
      var lst = TSS[dbN];
      for (var ri = 0; ri < lst.length; ri++) {
        var row = {}; for (var k in lst[ri]) row[k] = lst[ri][k]; row.db_name = dbN; rows.push(row);
      }
    }
    rows.sort(function(a,b){ return b.used_pct - a.used_pct; });
    filename = 'all_tablespace_summary.csv';
  }
  var lines = [cols.map(function(c){ return c.label; }).join(',')];
  for (var i = 0; i < rows.length; i++) {
    lines.push(cols.map(function(c){ return rows[i][c.key]; }).join(','));
  }
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\uFEFF'+lines.join('\n')], {type:'text/csv;charset=utf-8'}));
  a.download = filename;
  a.click();
}

  rebuildDates();

  if (el) el.textContent = '기준일: ' + d.today;

  DB_RAW = d.dbs;

function loadData() {
  var overlay = document.getElementById('loading-overlay');
  if (overlay) overlay.style.display = 'flex';

  fetch('api/data')
    .then(function(res) { return res.json(); })
    .then(function(resp) {
      if (!resp.ok) throw new Error(resp.error || 'API 오류');
      applyApiData(resp.data);
      if (overlay) overlay.style.display = 'none';
      init();
      // 모든 DB 트렌드 백그라운드 프리페치 (이후 DB 클릭 시 즉시 표시)
      prefetchAllTrends();
      // 사용률 가장 높은 DB 자동 선택
      if (DBS.length) {
        var topDb = DBS.slice().sort(function(a,b){ return b.used_pct - a.used_pct; })[0];
        selectDb(topDb.db_name);
      }
    })
    .catch(function(e) {
      console.warn('[API 연결 실패]', e.message);
      if (overlay) {
        overlay.innerHTML = '<div style="text-align:center">'
          + '<div style="font-size:15px;color:var(--red);margin-bottom:8px">&#9888; 서버 연결 실패</div>'
          + '<div style="font-size:12px;color:var(--t2);margin-bottom:4px">' + (e.message || '알 수 없는 오류') + '</div>'
          + '<div style="font-size:11px;color:var(--t3)">서버가 실행 중인지 확인 후 재시도하세요.</div>'
          + '<button onclick="loadData()" style="margin-top:14px;padding:6px 20px;background:var(--blue);color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:12px">&#8635; 재시도</button>'
          + '</div>';
      }
    });
}

// Chart.js 비동기 로드
(function() {
  var s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js';
  s.onload = function() {
    if (selDb) { drawBar(); drawHBar(); }
    if (selTs) { drawLine(); }
  };
  document.head.appendChild(s);
})();

// 데이터 로드 시작
loadData();
updateThreshBtn();

// 서버 상태 배지 — 최초 1회 + 30초마다 갱신
updateHealthBadge();
setInterval(updateHealthBadge, 30000);

// col-info 플로팅 툴팁
(function() {
  var tip = document.createElement('div');
  tip.id = 'col-tooltip';
  document.body.appendChild(tip);

  document.addEventListener('mouseover', function(e) {
    var el = e.target.closest ? e.target.closest('.col-info') : null;
    if (!el) return;
    tip.textContent = el.getAttribute('data-tip');
    tip.style.display = 'block';
  });
  document.addEventListener('mouseout', function(e) {
    var el = e.target.closest ? e.target.closest('.col-info') : null;
    if (!el) return;
    tip.style.display = 'none';
  });
  document.addEventListener('mousemove', function(e) {
    if (tip.style.display === 'none') return;
    var x = e.clientX + 12, y = e.clientY + 16;
    if (x + 240 > window.innerWidth) x = e.clientX - 242;
    tip.style.left = x + 'px';
    tip.style.top  = y + 'px';
  });
})();
</script>
